<svg viewBox="0 0 880 330" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Base and target DSM reports go into the comparator, which outputs added, modified and removed diagnostics." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#7fa3c4"/></marker></defs>
<rect width="880" height="330" rx="14" fill="#0f2236"/>
<text x="30" y="46" fill="#eaf1f8" font-size="24" font-weight="700">DSM Report Comparator</text>
<text x="30" y="70" fill="#9db6cc" font-size="13">Diagnostics delta between two PVER releases</text>

<rect x="30" y="100" width="200" height="72" rx="8" fill="#12304a" stroke="#2f5578"/>
<text x="130" y="128" fill="#eaf1f8" font-size="14" font-weight="600" text-anchor="middle">Base report</text>
<text x="130" y="150" fill="#8fb0cf" font-size="12" text-anchor="middle" font-family="Consolas, monospace">PVER n</text>
<rect x="30" y="218" width="200" height="72" rx="8" fill="#12304a" stroke="#2f5578"/>
<text x="130" y="246" fill="#eaf1f8" font-size="14" font-weight="600" text-anchor="middle">Target report</text>
<text x="130" y="268" fill="#8fb0cf" font-size="12" text-anchor="middle" font-family="Consolas, monospace">PVER n+1</text>

<path d="M232 136 L342 176" stroke="#7fa3c4" stroke-width="2" fill="none" marker-end="url(#ar)"/>
<path d="M232 254 L342 214" stroke="#7fa3c4" stroke-width="2" fill="none" marker-end="url(#ar)"/>

<rect x="346" y="145" width="190" height="100" rx="10" fill="#0b5cad"/>
<text x="441" y="188" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">Comparator</text>
<text x="441" y="210" fill="#cfe3f7" font-size="12" text-anchor="middle">DFC · FID · DSQ · DFQ</text>

<path d="M538 175 L630 122" stroke="#7fa3c4" stroke-width="2" fill="none" marker-end="url(#ar)"/>
<path d="M538 195 L630 195" stroke="#7fa3c4" stroke-width="2" fill="none" marker-end="url(#ar)"/>
<path d="M538 215 L630 268" stroke="#7fa3c4" stroke-width="2" fill="none" marker-end="url(#ar)"/>

<rect x="634" y="94" width="216" height="56" rx="8" fill="#0f3a2c" stroke="#3fd19a"/>
<text x="652" y="118" fill="#3fd19a" font-size="14" font-weight="700">+ Added</text>
<text x="652" y="138" fill="#a7e8cd" font-size="12">New diagnostics</text>
<rect x="634" y="167" width="216" height="56" rx="8" fill="#41300e" stroke="#f0b04a"/>
<text x="652" y="191" fill="#f0b04a" font-size="14" font-weight="700">~ Modified</text>
<text x="652" y="211" fill="#f5d596" font-size="12">FID, DFC mapping, description</text>
<rect x="634" y="240" width="216" height="56" rx="8" fill="#431b1b" stroke="#ff7b76"/>
<text x="652" y="264" fill="#ff7b76" font-size="14" font-weight="700">− Removed</text>
<text x="652" y="284" fill="#ffc2bf" font-size="12">Dropped diagnostics</text>
</svg>
